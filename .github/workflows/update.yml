name: Update Clinical Catalyst Dashboard

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Brussels"

  push:
    branches:
      - main
    paths:
      - "update_trials.py"
      - "verify_guidance.py"
      - "manual_catalysts.csv"
      - "company_map.csv"
      - "requirements.txt"
      - "site/index.html"
      - "site/.nojekyll"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "clinical-catalyst-pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      # Create this under:
      # Settings → Secrets and variables → Actions → Variables
      # Name: SEC_USER_AGENT
      # Example value: ClinicalCatalystTracker your-email@example.com
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh ClinicalTrials.gov data
        run: python update_trials.py

      - name: Scan SEC filings and company IR pages for readout guidance
        run: python verify_guidance.py

      - name: Commit refreshed trial data when changed
        shell: bash
        run: |
          if git diff --quiet -- site/trials.json; then
            echo "No trial-data changes to commit."
          else
            git config user.name "clinical-catalyst-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/trials.json
            git commit -m "Update clinical catalyst data and guidance flags"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
